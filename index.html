<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>יציקות בטון | הבית</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/main.js"></script>
</head>
<body>
<header class="top-bar">
  <h1>היציקות שלי</h1>
</header>

<main>
  <p class="page-lead">כל מה שקשור לעבודות יציקה בבטון — תבניות, השראה וחישובים, במקום אחד.</p>

  <div class="card-grid">
    <a class="cat-card" href="molds.html">
      <img class="cat-card-img" src="images/categories/molds.jpg" alt="" onerror="cardImgFallback(this)" />
      <div class="cat-card-overlay"></div>
      <div class="cat-card-text">
        <span class="cat-name">התבניות שלי</span>
        <span class="cat-sub">קטלוג לפי סיווגים</span>
      </div>
    </a>
    <a class="cat-card" href="inspiration.html">
      <img class="cat-card-img" src="images/categories/inspiration.jpg" alt="" onerror="cardImgFallback(this)" />
      <div class="cat-card-overlay"></div>
      <div class="cat-card-text">
        <span class="cat-name">לוחות השראה</span>
        <span class="cat-sub">צבעים, שילובים ואפקטים</span>
      </div>
    </a>
    <a class="cat-card" href="calculator.html" style="grid-column: 1 / -1;">
      <img class="cat-card-img" src="images/categories/calculator.jpg" alt="" onerror="cardImgFallback(this)" />
      <div class="cat-card-overlay"></div>
      <div class="cat-card-text">
        <span class="cat-name">מחשבון</span>
        <span class="cat-sub">בטון, מים וניצול חומר גלם</span>
      </div>
    </a>
  </div>

  <p style="text-align:center; margin-top:28px;">
    <a href="admin.html" style="color:var(--muted-on-bg); font-size:13px; border-bottom:1px solid var(--muted-on-bg);">הוספת תבנית או תמונה חדשה</a>
  </p>
</main>

<script src="js/data.js"></script>
<script>
  renderBottomNav("home");
</script>
</body>
</html>
