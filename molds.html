<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>התבניות שלי</title>
<link rel="stylesheet" href="css/style.css" />
<script src="js/main.js"></script>
</head>
<body>
<header class="top-bar">
  <a class="back-link" href="index.html">חזרה</a>
  <h1>התבניות שלי</h1>
</header>

<main>
  <p class="page-lead">בחרו סיווג כדי לראות את כל התבניות שבו.</p>
  <div class="card-grid" id="cat-grid"></div>
  <p class="empty-note" id="loading-note">טוען...</p>
</main>

<script src="js/data.js"></script>
<script src="js/data-loader.js"></script>
<script>
  (async () => {
    const { categories, molds } = await loadMoldData();
    const grid = document.getElementById("cat-grid");
    document.getElementById("loading-note").style.display = "none";
    grid.innerHTML = categories.map((cat) => {
      const count = molds.filter((m) => m.category === cat.id).length;
      const image = cat.image || `images/categories/${encodeURIComponent(cat.id)}.jpg`;
      return `<a class="cat-card" href="mold-category.html?cat=${encodeURIComponent(cat.id)}">
        <img class="cat-card-img" src="${image}" alt="" onerror="cardImgFallback(this)" />
        <div class="cat-card-overlay"></div>
        <div class="cat-card-text">
          <span class="cat-name">${cat.name}</span>
          <span class="cat-sub">${count} תבניות</span>
        </div>
      </a>`;
    }).join("");
  })();

  renderBottomNav("molds");
</script>
</body>
</html>
